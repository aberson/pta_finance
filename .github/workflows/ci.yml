name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra slides --extra receipts

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$(mktemp -d)"
          uv run pytest -q --ignore=tests/test_treasurer_slides_bank_statements_native.py --junitxml=lint-results.xml
          uv run python - <<'PY'
          from xml.etree import ElementTree
          cases = [case for case in ElementTree.parse('lint-results.xml').getroot().iter('testcase')
                   if case.attrib['classname'] == 'tests.test_receipt_viewer'
                   and case.attrib['name'].startswith('test_browser_')]
          expected = {
              'test_browser_receipt_navigation_zoom_focus_and_missing_source[viewport0]',
              'test_browser_receipt_navigation_zoom_focus_and_missing_source[viewport1]',
          }
          assert len(cases) == 2 and {case.attrib['name'] for case in cases} == expected
          assert all(case.find('skipped') is not None for case in cases), 'Receipt browser cases ran in lint-type-test'
          everything = list(ElementTree.parse('lint-results.xml').getroot().iter('testcase'))
          pages = [case for case in everything if case.attrib['classname'] == 'tests.test_receipt_pages']
          required = {
              'test_geometry_and_page_budget_are_imported_not_restated',
              'test_box_padding_mirrors_the_viewer_template',
              'test_rotated_exif_jpeg_normalizes_to_displayed_orientation[orientation-6]',
              'test_two_runs_produce_byte_identical_pages',
              'test_source_metadata_never_reaches_the_page[jpeg]',
              'test_broker_rejects_malformed_decode_response[wrong-length]',
              'test_broker_rejects_malformed_decode_response[extra-field]',
              'test_broker_stdout_read_is_capped',
              'test_broker_maps_child_exit_status[exit-child-error]',
              'test_an_empty_asset_is_a_per_asset_refusal_before_any_spawn[png]',
              'test_an_empty_asset_is_a_per_asset_refusal_before_any_spawn[jpeg]',
              'test_limits_the_child_would_refuse_abort_the_stage_before_any_spawn[memory-not-whole-pages]',
              'test_the_child_refuses_a_memory_limit_that_is_not_whole_pages',
              'test_an_abort_before_the_ready_line_kills_and_reaps_the_child_promptly',
          }
          assert required <= {case.attrib['name'] for case in pages}, 'Receipt page tests were not collected'
          assert all(case.find('skipped') is None for case in pages), 'Receipt page coverage was omitted'
          budget = [case for case in everything
                    if case.attrib['classname'] == 'tests.test_receipt_decode_budget']
          required_budget = {
              'test_known_good_anchor_yields_page[png-80mp-rgba]',
              'test_known_good_anchor_yields_page[jpeg-80mp-cmyk-progressive]',
              'test_known_good_anchor_yields_page[jpeg-motion-photo]',
              'test_known_good_anchor_yields_page[mpo-per-frame-exif]',
              'test_known_good_anchor_has_headroom[png-80mp-rgba]',
              'test_known_good_anchor_has_headroom[jpeg-80mp-cmyk-progressive]',
              'test_known_garbage_sentinel_is_refused[lanczos-strip]',
              'test_known_garbage_sentinel_is_refused[cpu-bound]',
              'test_known_garbage_sentinel_is_refused[wall-clock]',
              'test_decoding_pid_is_the_limited_process',
          }
          assert required_budget <= {case.attrib['name'] for case in budget}, 'Decode budget cases were not collected'
          assert all(case.find('skipped') is None for case in budget), 'Decode budget coverage was omitted'
          spike = [case for case in everything
                   if case.attrib['classname'] == 'tests.test_treasurer_slides_lpac_render_spike'
                   and case.attrib['name'] == 'test_lpac_render_spike_scores_the_real_lpac_render']
          assert len(spike) == 1, 'LPAC render spike case was not collected'
          assert spike[0].find('skipped') is not None, 'LPAC render spike claimed a measurement off Windows'
          PY
          uv run pytest -q tests/test_treasurer_slides_bank_statements_native.py -k "extractor_never_reads_a_pdf_if_the_sandbox_cannot_start"

      - name: Identity / secret guard
        run: uv run python scripts/check_no_identity.py

  shared-workflow:
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --extra dev --extra slides --extra web --extra receipts
          uv run playwright install --with-deps chromium
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - name: Start the local Firestore emulator
        run: |
          nohup gcloud emulators firestore start --project=example-workflow-test --host-port=127.0.0.1:8787 --quiet > "$RUNNER_TEMP/firestore.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/firestore.pid"
          uv run python - <<'PY'
          import socket, time
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(('127.0.0.1', 8787), timeout=1):
                      break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('Firestore emulator did not become ready')
          PY
      - name: Installed-wheel HTTP and browser smoke before the longer matrix
        run: uv run python scripts/shared_workflow_smoke.py --emulator-host 127.0.0.1:8787 --deadline-seconds 60
      - name: Receipt viewer browser test
        run: |
          uv run pytest -q tests/test_receipt_viewer.py -k browser --junitxml=receipt-browser-results.xml
          uv run python - <<'PY'
          from xml.etree import ElementTree
          cases = list(ElementTree.parse('receipt-browser-results.xml').getroot().iter('testcase'))
          expected = {
              'test_browser_receipt_navigation_zoom_focus_and_missing_source[viewport0]',
              'test_browser_receipt_navigation_zoom_focus_and_missing_source[viewport1]',
          }
          assert len(cases) == 2 and {case.attrib['name'] for case in cases} == expected
          assert all(case.find('skipped') is None for case in cases), 'Receipt browser coverage was omitted'
          PY
      - name: Full-package strict mypy
        run: uv run mypy --strict pta_finance
      - name: Web verification and distribution tests
        run: |
          uv run pytest -q tests/test_shared_workflow_*.py --junitxml=web-results.xml
          uv run python - <<'PY'
          from xml.etree import ElementTree
          suites = ElementTree.parse('web-results.xml').getroot().findall('testsuite')
          assert sum(int(s.attrib['tests']) for s in suites) > 0
          assert sum(int(s.attrib['skipped']) for s in suites) == 0, 'Web coverage was omitted'
          PY
      - name: Build distributions
        run: uv build
      - name: Stop the owned emulator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/firestore.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/firestore.pid")" || true
          fi

  windows-native-sandbox:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra slides --extra receipts

      - name: Native sandbox, statement parser, LPAC render spike, process limits and receipt decode tests
        shell: bash
        run: |
          uv run pytest -q --junitxml=windows-results.xml \
            tests/test_treasurer_slides_native_sandbox.py \
            tests/test_treasurer_slides_bank_statements_native.py \
            tests/test_treasurer_slides_lpac_render_spike.py \
            tests/test_process_limits.py \
            tests/test_receipt_pages.py \
            tests/test_receipt_decode_budget.py
          uv run python - <<'PY'
          from xml.etree import ElementTree
          everything = list(ElementTree.parse('windows-results.xml').getroot().iter('testcase'))
          def named(classname):
              return [case for case in everything if case.attrib['classname'] == classname]
          required = {
              'tests.test_receipt_decode_budget': {
                  'test_known_good_anchor_yields_page[png-80mp-rgba]',
                  'test_known_good_anchor_yields_page[jpeg-80mp-cmyk-progressive]',
                  'test_known_good_anchor_yields_page[jpeg-motion-photo]',
                  'test_known_good_anchor_yields_page[mpo-per-frame-exif]',
                  'test_known_good_anchor_has_headroom[png-80mp-rgba]',
                  'test_known_good_anchor_has_headroom[jpeg-80mp-cmyk-progressive]',
                  'test_known_garbage_sentinel_is_refused[lanczos-strip]',
                  'test_known_garbage_sentinel_is_refused[cpu-bound]',
                  'test_known_garbage_sentinel_is_refused[wall-clock]',
                  'test_decoding_pid_is_the_limited_process',
              },
              'tests.test_receipt_pages': {
                  'test_rotated_exif_jpeg_normalizes_to_displayed_orientation[orientation-6]',
                  'test_two_runs_produce_byte_identical_pages',
                  'test_broker_stdout_read_is_capped',
                  'test_an_empty_asset_is_a_per_asset_refusal_before_any_spawn[png]',
                  'test_an_empty_asset_is_a_per_asset_refusal_before_any_spawn[jpeg]',
                  'test_limits_the_child_would_refuse_abort_the_stage_before_any_spawn[memory-not-whole-pages]',
                  'test_the_child_refuses_a_memory_limit_that_is_not_whole_pages',
                  'test_an_abort_before_the_ready_line_kills_and_reaps_the_child_promptly',
              },
              'tests.test_process_limits': {
                  'test_a_real_job_limits_accounts_and_ends_a_child_process',
                  'test_job_structures_match_the_native_worker_copy_recursively',
              },
              'tests.test_treasurer_slides_lpac_render_spike': {
                  'test_lpac_render_spike_scores_the_real_lpac_render',
                  'test_render_request_answers_one_validated_gray8_page_through_the_worker_entry',
              },
          }
          for classname, names in required.items():
              cases = named(classname)
              found = {case.attrib['name']: case for case in cases}
              assert names <= set(found), f'{classname} required cases were not collected'
              assert all(found[name].find('skipped') is None for name in names), f'{classname} required cases were skipped'
          assert all(case.find('skipped') is None for case in named('tests.test_receipt_decode_budget')), 'Decode budget coverage was omitted'
          assert all(case.find('skipped') is None for case in named('tests.test_receipt_pages')), 'Receipt page coverage was omitted'
          assert all(case.find('skipped') is None for case in named('tests.test_treasurer_slides_lpac_render_spike')), 'LPAC render spike coverage was omitted'
          spike = {prop.attrib['name']: prop.attrib['value']
                   for prop in ElementTree.parse('windows-results.xml').getroot().iter('property')
                   if prop.attrib['name'].startswith('lpac_render_spike.')}
          for name in sorted(spike):
              print(f'{name}={spike[name]}')
          for anchor in ('known_good', 'all_white', 'box_glyph', 'lpac'):
              assert {f'lpac_render_spike.{anchor}.ink', f'lpac_render_spike.{anchor}.ncc'} <= set(spike), f'LPAC render spike recorded no {anchor} measurement'
          assert spike.get('lpac_render_spike.verdict') in {'pass', 'blocked'}, 'LPAC render spike produced no verdict'
          PY

      - name: Receipt sidecar headroom tests (Windows drive and UNC rules)
        run: uv run pytest -q tests/test_receipt_viewer.py -k headroom
