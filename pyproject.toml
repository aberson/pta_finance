[project]
name = "pta_finance"
version = "0.1.0"
description = "Generic, reusable finance toolkit for a PTA / booster club / small nonprofit (Google Sheet as system-of-record)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gspread",
    "google-auth",
    "pandas",
    "matplotlib",
    "jinja2",
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.0",
]

[project.optional-dependencies]
pdf = ["weasyprint"]
slides = ["pypdfium2>=5.13.0"]
web = ["fastapi", "uvicorn", "google-cloud-firestore", "cryptography"]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx",
    "playwright",
]

[project.scripts]
pta-finance = "pta_finance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pta_finance"]

[tool.hatch.build.targets.sdist]
exclude = ["/.build-step", "/.review-deep"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "gspread",
    "gspread.*",
    "google.*",
    # Neither of these is matched by "google.*" — they are distinct top-level packages
    # and both are untyped, so `mypy --strict` errors without their own entries.
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "matplotlib",
    "matplotlib.*",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires the real loopback Firestore emulator"]
